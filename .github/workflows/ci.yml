name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: Build & test da API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Testes unitários e de integração (Vitest)
        run: npm test

  web:
    name: Build do front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  publish:
    name: Publicar imagens no GHCR
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./src/api
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Build & push da imagem do front-end
        uses: docker/build-push-action@v6
        with:
          context: ./src/web
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
